{% extends "base.html" %}
{% block title %}Registrasi{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Daftar Petugas</h1>
  <form method="post" action="/register">
    <label>Nama lengkap <input name="nama" required></label>
    <label>Username <input name="username" required></label>
    <label>Password (min. 6 karakter) <input name="password" type="password" minlength="6" required></label>
    <label>Ulangi password <input name="password2" type="password" minlength="6" required></label>
    <button class="btn primary" type="submit">Daftar</button>
  </form>
  <p class="muted">Sudah punya akun? <a href="/login">Masuk</a></p>
</div>
{% endblock %}
